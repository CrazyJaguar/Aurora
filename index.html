<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Hospital</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── GLOBAL STYLES ─── */
const globalCSS = `
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Outfit', sans-serif; background: #faf8f4; color: #1c1917; overflow-x: hidden; }

  :root {
    --sand: #faf8f4;
    --sand2: #f2ede4;
    --sand3: #e8dfd0;
    --sky: #4a7fa5;
    --sky-light: #e8f2f9;
    --sky-mid: #b8d4e8;
    --terra: #c47a4a;
    --terra-light: #f5e8dc;
    --sage: #5a7a5c;
    --sage-light: #e4ede4;
    --ink: #1c1917;
    --ink-mid: #44403c;
    --ink-light: #78716c;
    --border: #e2d9cc;
    --shadow-sm: 0 2px 12px rgba(28,25,23,0.06);
    --shadow-md: 0 8px 40px rgba(28,25,23,0.1);
    --shadow-lg: 0 20px 80px rgba(28,25,23,0.14);
    --r-sm: 12px;
    --r-md: 20px;
    --r-lg: 32px;
  }

  ::selection { background: var(--sky-mid); color: var(--ink); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--sand2); }
  ::-webkit-scrollbar-thumb { background: var(--sky-mid); border-radius: 3px; }

  /* Animations */
  @keyframes fadeUp   { from { opacity:0; transform:translateY(32px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
  @keyframes slideIn  { from { opacity:0; transform:translateX(-24px); } to { opacity:1; transform:translateX(0); } }
  @keyframes floatUp  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:0.5} }
  @keyframes spin     { to { transform: rotate(360deg); } }

  .anim-fadeup  { animation: fadeUp  0.7s ease both; }
  .anim-fadein  { animation: fadeIn  0.6s ease both; }
  .anim-slidein { animation: slideIn 0.6s ease both; }

  /* Page transitions */
  .page-enter { animation: fadeUp 0.5s ease both; }

  /* Reveal on scroll */
  .reveal { opacity:0; transform:translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in { opacity:1; transform:translateY(0); }

  /* Utility */
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--sky-light); color: var(--sky);
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 5px 14px; border-radius: 50px;
  }
  .tag.terra { background: var(--terra-light); color: var(--terra); }
  .tag.sage  { background: var(--sage-light);  color: var(--sage);  }
  .tag::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }

  .section-heading {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 3.4rem);
    font-weight: 600;
    line-height: 1.15;
    color: var(--ink);
  }
  .section-heading em { font-style: italic; color: var(--sky); }
  .section-heading .terra { color: var(--terra); }

  .section-sub {
    font-size: 1rem; font-weight: 300; color: var(--ink-light);
    line-height: 1.8; max-width: 540px;
  }

  /* Btn */
  .btn { display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 500; transition: all 0.25s ease; text-decoration: none; }
  .btn-sky  { background: var(--sky);  color: white; padding: 0.85rem 2rem; border-radius: 50px; font-size: 0.9rem; }
  .btn-sky:hover  { background: #3a6a8f; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(74,127,165,0.35); }
  .btn-terra{ background: var(--terra); color: white; padding: 0.85rem 2rem; border-radius: 50px; font-size: 0.9rem; }
  .btn-terra:hover{ background: #a8623a; transform:translateY(-2px); box-shadow: 0 8px 24px rgba(196,122,74,0.35); }
  .btn-outline { background: transparent; color: var(--sky); padding: 0.82rem 1.9rem; border-radius: 50px; font-size: 0.9rem; border: 1.5px solid var(--sky); }
  .btn-outline:hover { background: var(--sky-light); }
  .btn-outline-sand { background: transparent; color: white; padding: 0.82rem 1.9rem; border-radius: 50px; font-size: 0.9rem; border: 1.5px solid rgba(255,255,255,0.5); }
  .btn-outline-sand:hover { background: rgba(255,255,255,0.12); }

  /* Card base */
  .card { background: white; border-radius: var(--r-md); border: 1px solid var(--border); transition: all 0.3s ease; }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-4px); }

  /* Input */
  .inp {
    width: 100%; border: 1.5px solid var(--border); border-radius: var(--r-sm);
    padding: 0.78rem 1rem; font-family: 'Outfit', sans-serif; font-size: 0.9rem;
    background: var(--sand); color: var(--ink); outline: none; transition: border-color 0.2s, background 0.2s;
    -webkit-appearance: none;
  }
  .inp:focus { border-color: var(--sky); background: white; }
  .inp-label { font-size: 0.75rem; font-weight: 600; color: var(--ink-light); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; display: block; }

  /* NAV */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 300;
    height: 70px; padding: 0 5%;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(250,248,244,0.92); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    transition: box-shadow 0.3s;
  }
  .nav.scrolled { box-shadow: var(--shadow-sm); }
  .nav-logo-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .nav-logo-icon {
    width: 38px; height: 38px; background: var(--sky);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; color: white; font-weight: 700; flex-shrink: 0;
  }
  .nav-logo-text { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--ink); }
  .nav-logo-text span { color: var(--sky); }
  .nav-links { display: flex; gap: 0.2rem; list-style: none; align-items: center; }
  .nav-link {
    padding: 0.45rem 1rem; border-radius: 8px; font-size: 0.88rem; color: var(--ink-mid);
    cursor: pointer; transition: all 0.2s; font-weight: 400; border: none; background: none;
    font-family: 'Outfit', sans-serif;
  }
  .nav-link:hover { background: var(--sand2); color: var(--sky); }
  .nav-link.active { color: var(--sky); font-weight: 600; background: var(--sky-light); }
  .nav-cta { margin-left: 0.8rem; }
  .ham { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 6px; background: none; border: none; z-index: 301; }
  .ham span { display: block; width: 22px; height: 2px; background: var(--ink); border-radius: 2px; transition: all 0.3s; }
  .ham.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
  .ham.open span:nth-child(2){ opacity:0; }
  .ham.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
  .mob-nav {
    display: none; position: fixed; top: 70px; left: 0; right: 0; z-index: 299;
    background: white; border-bottom: 1px solid var(--border);
    padding: 1.5rem 5% 2rem; flex-direction: column; gap: 0.2rem;
    opacity: 0; transform: translateY(-8px); pointer-events: none;
    transition: all 0.3s ease; box-shadow: var(--shadow-md);
  }
  .mob-nav.open { opacity:1; transform:translateY(0); pointer-events:all; }
  .mob-nav-link {
    padding: 0.85rem 1rem; border-radius: 10px; font-size: 1rem;
    color: var(--ink-mid); cursor: pointer; border: none; background: none;
    font-family: 'Outfit', sans-serif; text-align: left; width: 100%;
    transition: all 0.2s;
  }
  .mob-nav-link:hover { background: var(--sand2); color: var(--sky); }
  .mob-nav-link.active { background: var(--sky-light); color: var(--sky); font-weight: 600; }
  .mob-nav-cta { margin-top: 0.8rem; width: 100%; justify-content: center; border-radius: 12px; padding: 0.9rem; }

  /* HERO */
  .hero { min-height: 100vh; padding-top: 70px; display: grid; grid-template-columns: 1fr 1fr; }
  .hero-left {
    padding: 6% 5% 6% 8%; display: flex; flex-direction: column; justify-content: center;
    background: var(--sand);
  }
  .hero-right { background: var(--sky); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .hero-right-bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #4a7fa5 0%, #3a6a8f 40%, #2d5470 100%);
  }
  .hero-right-pattern {
    position: absolute; inset: 0; opacity: 0.08;
    background-image: radial-gradient(circle, white 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .hero-visual { position: relative; z-index: 2; width: 80%; max-width: 380px; }
  .hero-card-main {
    background: rgba(255,255,255,0.14); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.25); border-radius: var(--r-lg);
    padding: 2rem; color: white;
  }
  .hero-stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
  .hero-stat-box {
    background: rgba(255,255,255,0.12); border-radius: var(--r-sm);
    padding: 1.1rem; text-align: center; border: 1px solid rgba(255,255,255,0.15);
  }
  .hero-stat-num { font-family: 'Playfair Display', serif; font-size: 1.9rem; font-weight: 700; color: white; }
  .hero-stat-lbl { font-size: 0.72rem; color: rgba(255,255,255,0.72); margin-top: 2px; font-weight: 400; }
  .hero-float-card {
    position: absolute; background: white; border-radius: var(--r-md);
    box-shadow: var(--shadow-md); padding: 0.9rem 1.1rem; z-index: 10;
  }
  .hfc-top  { top: 14%; right: 6%; animation: floatUp 5s ease-in-out infinite; }
  .hfc-bot  { bottom: 14%; left: 6%; animation: floatUp 5s ease-in-out infinite 2.5s; }
  .hfc-label{ font-size: 0.68rem; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.06em; }
  .hfc-val  { font-size: 0.95rem; font-weight: 600; color: var(--ink); margin-top: 3px; white-space: nowrap; }
  .hfc-sub  { font-size: 0.72rem; color: var(--sky); margin-top: 2px; white-space: nowrap; }
  .dot-live { display: inline-block; width: 7px; height: 7px; background: #4ade80; border-radius: 50%; animation: pulse 1.5s infinite; margin-right: 4px; }

  /* DEPARTMENTS PAGE */
  .dept-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
  .dept-card {
    background: white; border-radius: var(--r-md); border: 1px solid var(--border);
    padding: 2rem; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden;
  }
  .dept-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background: var(--sky); transform: scaleX(0); transition: transform 0.3s ease; transform-origin: left; }
  .dept-card:hover::before { transform: scaleX(1); }
  .dept-card:hover { box-shadow: var(--shadow-md); transform: translateY(-4px); border-color: var(--sky-mid); }
  .dept-icon { width: 56px; height: 56px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 1.2rem; }
  .dept-name { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 600; margin-bottom: 0.5rem; }
  .dept-desc { font-size: 0.84rem; color: var(--ink-light); line-height: 1.7; }
  .dept-count { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; color: var(--sky); font-weight: 600; margin-top: 1rem; }

  /* DOCTORS PAGE */
  .doc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.8rem; }
  .doc-card { background: white; border-radius: var(--r-md); border: 1px solid var(--border); overflow: hidden; transition: all 0.3s; cursor: pointer; }
  .doc-card:hover { box-shadow: var(--shadow-md); transform: translateY(-5px); }
  .doc-photo { aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; font-size: 4.5rem; position: relative; }
  .doc-d1{background:linear-gradient(160deg,#e8f2f9,#c8e0f0)}
  .doc-d2{background:linear-gradient(160deg,#f5e8dc,#ebd4bc)}
  .doc-d3{background:linear-gradient(160deg,#e4ede4,#c8dcc8)}
  .doc-d4{background:linear-gradient(160deg,#f0ece4,#e2d8c8)}
  .doc-d5{background:linear-gradient(160deg,#f5eaf2,#e8d0e4)}
  .doc-d6{background:linear-gradient(160deg,#e4ece8,#c8dcd4)}
  .doc-body { padding: 1.4rem; }
  .doc-name { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 600; }
  .doc-spec { font-size: 0.78rem; color: var(--sky); font-weight: 600; margin-top: 3px; }
  .doc-exp  { font-size: 0.78rem; color: var(--ink-light); margin-top: 2px; }
  .doc-stars{ color: #f59e0b; font-size: 0.85rem; margin-top: 8px; }
  .doc-avail{ display: inline-flex; align-items: center; gap: 5px; font-size: 0.74rem; color: var(--sage); font-weight: 600; margin-top: 8px; }

  /* ABOUT */
  .about-hero { min-height: 60vh; padding-top: 70px; background: linear-gradient(135deg, #4a7fa5, #3a6a8f); display: flex; align-items: center; justify-content: center; text-align: center; padding-left: 8%; padding-right: 8%; position: relative; overflow: hidden; }
  .about-pattern { position: absolute; inset:0; opacity:0.06; background-image: radial-gradient(circle, white 1.5px, transparent 1.5px); background-size: 32px 32px; }
  .timeline { display: flex; flex-direction: column; gap: 0; position: relative; }
  .timeline::before { content:''; position:absolute; left:28px; top:0; bottom:0; width:2px; background:var(--border); }
  .tl-item { display: flex; gap: 2rem; padding-bottom: 2.5rem; position: relative; }
  .tl-dot { width: 58px; height: 58px; min-width: 58px; border-radius: 50%; background: var(--sky); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: white; position: relative; z-index: 1; box-shadow: 0 0 0 6px var(--sky-light); }
  .tl-year { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--sky); }
  .tl-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 600; margin-top: 0.2rem; }
  .tl-desc { font-size: 0.85rem; color: var(--ink-light); line-height: 1.7; margin-top: 0.4rem; }
  .values-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 1.3rem; }
  .val-card { background: white; border-radius: var(--r-md); border: 1px solid var(--border); padding: 1.8rem; text-align: center; transition: all 0.3s; }
  .val-card:hover { box-shadow: var(--shadow-sm); transform: translateY(-3px); }
  .val-icon { font-size: 2rem; margin-bottom: 0.8rem; }
  .val-name { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
  .val-desc { font-size: 0.82rem; color: var(--ink-light); line-height: 1.65; }

  /* CONTACT */
  .contact-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 4rem; align-items: start; }
  .contact-info-card { background: var(--sky); border-radius: var(--r-lg); padding: 3rem; color: white; }
  .ci-item { display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 1.8rem; }
  .ci-icon { width: 44px; height: 44px; min-width: 44px; background: rgba(255,255,255,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .ci-label { font-size: 0.73rem; color: rgba(255,255,255,0.65); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .ci-val { font-size: 0.95rem; color: white; font-weight: 500; margin-top: 2px; }
  .contact-form-card { background: white; border-radius: var(--r-lg); border: 1px solid var(--border); padding: 2.5rem; }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-field { margin-bottom: 1.1rem; }

  /* FOOTER */
  .footer { background: var(--ink); color: rgba(255,255,255,0.75); padding: 5rem 8% 2rem; }
  .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 3rem; padding-bottom: 3rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .footer-brand { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: white; font-weight: 700; margin-bottom: 1rem; }
  .footer-brand span { color: var(--sky-mid); }
  .footer-desc { font-size: 0.84rem; line-height: 1.75; color: rgba(255,255,255,0.45); max-width: 270px; }
  .footer-col h5 { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.35); margin-bottom: 1.2rem; font-weight: 600; }
  .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; }
  .footer-col ul li { font-size: 0.84rem; color: rgba(255,255,255,0.6); cursor: pointer; transition: color 0.2s; }
  .footer-col ul li:hover { color: white; }
  .footer-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 2rem; font-size: 0.78rem; color: rgba(255,255,255,0.25); flex-wrap: wrap; gap: 0.5rem; }

  /* RESPONSIVE */
  @media(max-width:1024px){
    .dept-grid { grid-template-columns: repeat(2,1fr); }
    .doc-grid { grid-template-columns: repeat(2,1fr); }
    .values-grid { grid-template-columns: repeat(2,1fr); }
    .footer-grid { grid-template-columns: 1fr 1fr; }
  }
  @media(max-width:900px){
    .nav-links,.nav-cta { display:none; }
    .ham { display:flex; }
    .mob-nav { display:flex; }
    .hero { grid-template-columns:1fr; min-height:auto; }
    .hero-left { padding: 3rem 6% 2rem 6%; order:1; }
    .hero-right { min-height:400px; order:2; }
    .contact-grid { grid-template-columns:1fr; }
  }
  @media(max-width:640px){
    .dept-grid { grid-template-columns:1fr; }
    .doc-grid { grid-template-columns:1fr 1fr; }
    .values-grid { grid-template-columns:1fr 1fr; }
    .footer-grid { grid-template-columns:1fr; gap:2rem; }
    .form-grid-2 { grid-template-columns:1fr; }
    .hero-stat-row { grid-template-columns:1fr 1fr; }
    .hfc-top { top:8%; right:3%; }
    .hfc-bot { bottom:8%; left:3%; }
  }
  @media(max-width:480px){
    .doc-grid { grid-template-columns:1fr; }
    .hero-float-card { padding:0.7rem 0.9rem; }
    .hfc-val { font-size:0.85rem; }
  }

  /* PAGE-SPECIFIC PADDING */
  .page-body { padding: 5rem 8%; }
  .page-hero {
    padding-top: 70px; min-height: 42vh;
    display: flex; align-items: flex-end; padding-bottom: 3.5rem;
    padding-left: 8%; padding-right: 8%;
    position: relative; overflow: hidden;
  }
  .page-hero-bg { position:absolute; inset:0; z-index:0; }
  .page-hero-content { position:relative; z-index:1; }

  /* Divider */
  .divider { height:1px; background:var(--border); margin: 3.5rem 0; }

  /* Stats bar */
  .stats-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:0; background:var(--sky); border-radius:var(--r-lg); overflow:hidden; }
  .stats-bar-item { padding:2rem 2rem; text-align:center; border-right:1px solid rgba(255,255,255,0.15); }
  .stats-bar-item:last-child { border-right:none; }
  .stats-bar-num { font-family:'Playfair Display',serif; font-size:2.5rem; font-weight:700; color:white; }
  .stats-bar-lbl { font-size:0.8rem; color:rgba(255,255,255,0.7); margin-top:4px; font-weight:400; }
  @media(max-width:640px){
    .stats-bar { grid-template-columns:1fr 1fr; }
    .stats-bar-item { border-right:none; border-bottom:1px solid rgba(255,255,255,0.12); }
    .stats-bar-item:nth-child(odd){ border-right:1px solid rgba(255,255,255,0.12); }
  }

  /* News cards */
  .news-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem; }
  .news-card { background:white; border-radius:var(--r-md); border:1px solid var(--border); overflow:hidden; transition:all 0.3s; cursor:pointer; }
  .news-card:hover { box-shadow:var(--shadow-md); transform:translateY(-4px); }
  .news-img { height:180px; display:flex; align-items:center; justify-content:center; font-size:3rem; }
  .news-body { padding:1.4rem; }
  .news-meta { font-size:0.74rem; color:var(--ink-light); margin-bottom:0.6rem; }
  .news-title { font-family:'Playfair Display',serif; font-size:1.05rem; font-weight:600; line-height:1.4; margin-bottom:0.5rem; }
  .news-excerpt { font-size:0.82rem; color:var(--ink-light); line-height:1.65; }
  @media(max-width:900px){ .news-grid{grid-template-columns:1fr 1fr;} }
  @media(max-width:600px){ .news-grid{grid-template-columns:1fr;} }

  /* Trust badges */

/* ─── HOOKS ─── */
function useScrolled() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 20);
    window.addEventListener("scroll", h);
    return () => window.removeEventListener("scroll", h);
  }, []);
  return scrolled;
}

function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    const obs = new IntersectionObserver(
      entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); }),
      { threshold: 0.1 }
    );
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}
